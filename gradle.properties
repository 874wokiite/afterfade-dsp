org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
# The suite already runs on jvmTest and iosSimulatorArm64Test; a third run as an Android host test adds nothing
android.sync.suppressAgpWarnings=GENERIC
# iosX64 cannot run tests on an Apple Silicon host; it is still compiled
kotlin.native.ignoreDisabledTargets=true
