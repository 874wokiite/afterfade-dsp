name: Playground

# Builds the Kotlin/Wasm playground under samples/playground and publishes it with GitHub Pages.
#
# Manual only for now: the deploy job needs Pages enabled in the repository settings
# ("Source: GitHub Actions"), which a private repository on the free plan cannot do. Once the
# repository is public and Pages is enabled, add a push trigger here:
#
#   push:
#     branches: [main]
#     paths: ["src/**", "samples/playground/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the playground
        run: ./gradlew -p samples :playground:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/playground/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
