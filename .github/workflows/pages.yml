name: Playground

# Builds the Kotlin/Wasm playground under samples/playground and publishes it with GitHub Pages
# (Pages source: GitHub Actions). Runs on every push to main that touches the library or the
# playground, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "samples/playground/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the playground
        run: ./gradlew -p samples :playground:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/playground/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
