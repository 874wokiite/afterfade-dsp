name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS so the iOS simulator tests can run next to the JVM ones
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests
        run: ./gradlew jvmTest --no-daemon
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --no-daemon
      - name: Compile every target
        run: ./gradlew assemble --no-daemon
